name: wasm-smoke

on:
  workflow_dispatch:

jobs:
  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build write Lua bundle
        run: npm run bundle:write

      - name: Detect AO runtime package
        id: runtime
        run: |
          if [ -f dist/write/process.lua ] && [ -f dist/write/config.yml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "AO runtime package found in dist/write."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "dist/write/process.lua + config.yml are not checked in; skipping Docker WASM rebuild."
          fi

      - name: Rebuild WASM from AO runtime package
        if: steps.runtime.outputs.found == 'true'
        run: npm run build:ao-wasm

      - name: Smoke WASM artifact
        if: steps.runtime.outputs.found == 'true'
        run: npm run smoke:wasm
